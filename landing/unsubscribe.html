<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextLevel — Abonelik İptal</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
body { background:linear-gradient(180deg,#f0f7ff 0%,#fff 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1f2937; }
.card { background:#fff; max-width:480px; width:100%; padding:40px 32px; border-radius:14px; box-shadow:0 4px 24px rgba(11,83,148,0.08); border:1px solid #e5e7eb; text-align:center; }
.icon { font-size:48px; margin-bottom:12px; }
h1 { font-size:22px; margin-bottom:12px; }
p { line-height:1.6; color:#6b7280; margin-bottom:14px; }
.btn { display:inline-block; background:#0b5394; color:#fff; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:600; margin-top:14px; }
.loading { color:#6b7280; }
.success { color:#059669; }
.error { color:#dc2626; }
</style>
</head>
<body>
<div class="card">
  <div id="status">
    <div class="icon loading">⏳</div>
    <h1>İşleminiz yapılıyor...</h1>
    <p>Aboneliğinizi iptal ediyoruz.</p>
  </div>
</div>

<script>
// Supabase credentials - same as start.html
const SUPABASE_URL = 'https://cqjbquifziemlzjcgdsw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxamJxdWlmemllbWx6amNnZHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4Mzc2OTUsImV4cCI6MjA5NDQxMzY5NX0.Q3iiCXG0LKVTLkVNBxDN4ipXLA3HzqC91fUBBoH7CcQ';

(async () => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const statusEl = document.getElementById('status');

  if (!token || token.length < 12) {
    statusEl.innerHTML = '<div class="icon error">⚠️</div><h1>Geçersiz link</h1><p>Bu iptal linki geçerli değil. Lütfen email\'inizdeki linke tekrar tıklayın.</p>';
    return;
  }

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/subscribers?unsubscribe_token=eq.' + encodeURIComponent(token), {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ status: 'cancelled' })
    });

    if (res.ok) {
      statusEl.innerHTML = '<div class="icon success">✓</div><h1>Aboneliğiniz iptal edildi</h1><p>Bir daha rapor almayacaksınız. Yeniden katılmak isterseniz aşağıdaki butona tıklayabilirsiniz.</p><a class="btn" href="/start.html">Yeniden Abone Ol</a>';
    } else {
      throw new Error('failed');
    }
  } catch (err) {
    statusEl.innerHTML = '<div class="icon error">⚠️</div><h1>Bir sorun oluştu</h1><p>Lütfen <a href="mailto:hello@nextleveljobhunter.com">hello@nextleveljobhunter.com</a> adresine yazın.</p>';
  }
})();
</script>
</body>
</html>
